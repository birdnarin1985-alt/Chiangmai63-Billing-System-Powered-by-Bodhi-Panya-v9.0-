<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบออกใบวางบิล - เชียงใหม่ 63 การช่าง</title>
    
    <!-- 🧬 BODHI-PANYA ENGINE v9.0: DNA CORE BLOCK -->
    <meta name="engine-dna" content="Bodhi-Panya v9.0 Birthday & iPhone Genesis Edition">
    <meta name="author" content="ช่างเบิร์ด (Chang Bird)">
    <meta name="developer-email" content="bird.narin1985@gmail.com">
    <meta name="genesis-story" content="พัฒนาด้วย iPhone เพียงเครื่องเดียว อดหลับอดนอน 2 คืน 3 วัน">
    <meta name="mantra" content="สัมปติจฉามิ">

    <!-- Tailwind CSS สำหรับดีไซน์ที่สวยงาม ทันสมัย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>

    <script>
        console.log("🎂 [Bodhi-Panya v9.0 DNA Loaded]: iPhone Genesis Edition");
        console.log("✨ [Mantra]: สัมปติจฉามิ - สว่างไสว ปลอดภัย สำเร็จทุกประการ");

        function showBodhiPanyaDNA() {
            alert(`🎂 Bodhi-Panya Engine v9.0 DNA Core:\n\n` +
                  `📱 พัฒนาด้วย iPhone เพียงเครื่องเดียว 2 คืน 3 วัน\n` +
                  `👨‍💻 ผู้สร้าง: ช่างเบิร์ด (Chang Bird)\n` +
                  `✉️ ติดต่อ: bird.narin1985@gmail.com\n` +
                  `🙏 สัมปติจฉามิ... ขอให้งานบัญชีสำเร็จลุล่วงด้วยดี!`);
        }
    </script>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-900 to-indigo-800 text-white p-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl md:text-2xl font-bold">ห้างหุ้นส่วนจำกัด เชียงใหม่ 63 การช่าง</h1>
                <p class="text-xs text-blue-200 mt-1">ระบบออกใบวางบิล & ใบเสร็จรับเงินอัตโนมัติ</p>
            </div>
            <button onclick="showBodhiPanyaDNA()" class="bg-amber-500 hover:bg-amber-400 text-slate-900 text-xs font-bold px-3 py-2 rounded-lg shadow transition">
                🧬 Bodhi-Panya v9.0
            </button>
        </div>

        <!-- Form Section -->
        <div class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">เลือกบริษัทลูกค้า:</label>
                    <select id="clientSelect" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="บริษัท เอแพค จำกัด">บริษัท เอแพค จำกัด</option>
                        <option value="บริษัท นอร์ทเทิร์นเดเวลอปเมนท์ จำกัด">บริษัท นอร์ทเทิร์นเดเวลอปเมนท์ จำกัด</option>
                        <option value="บริษัท ล้านนาพรॉपอร์ตี้ จำกัด">บริษัท ล้านนาพร็อพเพอร์ตี้ จำกัด</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ประจำเดือน / รอบบิล:</label>
                    <input type="text" id="billingMonth" value="ประจำเดือน กันยายน 2569" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-1">รายการบริการ / งานก่อสร้าง:</label>
                <input type="text" id="serviceItem" value="ค่าบริการดูแลรักษาและซ่อมแซมโครงสร้างประจำงวด" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">จำนวนเงิน (บาท):</label>
                    <input type="number" id="serviceAmount" value="15000" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">ประเภทเอกสาร:</label>
                    <select id="docType" class="w-full border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        <option value="ใบวางบิล (Billing Note)">ใบวางบิล (Billing Note)</option>
                        <option value="ใบเสร็จรับเงิน / ใบกำกับภาษี">ใบเสร็จรับเงิน / ใบกำกับภาษี</option>
                    </select>
                </div>
            </div>

            <div class="pt-4">
                <button onclick="generateDocument()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
                    <span>✨ สร้างเอกสาร (สัมปติจฉามิ)</span>
                </button>
            </div>
        </div>

        <!-- Preview Result Box -->
        <div id="previewBox" class="hidden bg-slate-50 border-t border-slate-200 p-6 space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-slate-800" id="resTitle">ผลลัพธ์เอกสาร</h3>
                <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-1 rounded font-semibold">พร้อมพิมพ์ / ส่งออก</span>
            </div>
            <div class="text-sm text-slate-700 space-y-1">
                <p><strong>ลูกค้า:</strong> <span id="resClient"></span></p>
                <p><strong>รอบบิล:</strong> <span id="resMonth"></span></p>
                <p><strong>รายการ:</strong> <span id="resItem"></span></p>
                <p class="text-lg font-bold text-blue-900 mt-2">ยอดรวมทั้งสิ้น: <span id="resTotal"></span> บาท</p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="window.print()" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold py-2 rounded-lg transition">🖨️ พิมพ์เอกสาร / บันทึก PDF</button>
            </div>
        </div>
    </div>

    <script>
        function generateDocument() {
            const client = document.getElementById('clientSelect').value;
            const month = document.getElementById('billingMonth').value;
            const item = document.getElementById('serviceItem').value;
            const amount = parseFloat(document.getElementById('serviceAmount').value).toLocaleString();
            const docType = document.getElementById('docType').value;

            document.getElementById('resTitle').innerText = `ตัวอย่างเอกสาร: ${docType}`;
            document.getElementById('resClient').innerText = client;
            document.getElementById('resMonth').innerText = month;
            document.getElementById('resItem').innerText = item;
            document.getElementById('resTotal').innerText = amount;

            document.getElementById('previewBox').classList.remove('hidden');

            // คาถาขับเคลื่อนตาม DNA
            console.log("🙏 สัมปติจฉามิ... สร้างเอกสารสำเร็จเรียบร้อย");
        }
    </script>
</body>
</html>
